    <!--
      The SA mark, at the sizes each surface asks for.

      No ?v= cache-buster any more. It was there because browsers cache favicons
      hard — but these files are served with max-age=0, must-revalidate and an
      ETag, so a browser revalidates on every load and picks up a new mark
      without being tricked into it. Google keys its favicon index on the URL,
      so every bump of ?v= was a brand-new icon it had to rediscover and
      re-crawl. A stable URL is worth more than a cache-buster that buys us
      nothing here.

      Largest first: Google wants a square whose sides are a multiple of 48px
      and rescales it to 48x48, so 192 is the one it should settle on.

      One mark on every surface — favicon, tab, home screen, workspace and
      share card all render the same logo, cropped to itself so it fills the
      tile instead of floating in the plate it ships on. That crop buys about a
      fifth more size at no cost to the design, which is what makes the SA
      legible in a 32px tab. At the 16px Google draws it is still dense; that
      is the price of a detailed mark, and it is the mark that matters.
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-sa-192.png" />
